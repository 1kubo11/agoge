/* základ, ktorý v artifacte dodával obal – tu si ho robíme sami */
:root{
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

}

<body>
<style>
/* Layout: jedna mobilná kolóna, fixná spodná navigácia, karty na čiernom poli */
:root{
  --coal:#0B0B0C;
  --stone:#15161A;
  --stone-2:#1D1F24;
  --line:#2C2E35;
  --bronze:#C08E45;
  --bronze-dim:#8A6630;
  --blood:#7E1C1C;
  --blood-bright:#A82A2A;
  --ash:#9A9892;
  --bone:#EDE9E2;
  --ok:#5F8F4E;
  --font-d:"Oswald","Oswald Fallback",Impact,"Haettenschweiler","Arial Narrow",sans-serif;
  --font-b:"Inter","Inter Fallback",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--coal);
  color:var(--bone);
  font-family:var(--font-b);
  font-size:16px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
}
#app{
  max-width:560px;
  margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(104px + env(safe-area-inset-bottom,0px));
}
h1,h2,h3,.disp{font-family:var(--font-d);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:0;text-wrap:balance}
p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- hlavička ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--coal)}
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:linear-gradient(180deg,var(--coal) 70%,rgba(11,11,12,0));
  padding-block:14px 10px;
  display:flex;align-items:center;gap:12px;
}
.crest{width:34px;height:40px;flex:0 0 auto}
.brand{flex:1;min-width:0}
.brand .nm{font-family:var(--font-d);font-size:22px;font-weight:700;letter-spacing:.12em;line-height:1;color:var(--bone)}
.brand .sub{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze-dim);margin-top:3px}
.modebtn{
  flex:0 0 auto;border:1px solid var(--line);border-radius:999px;
  padding:8px 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  font-family:var(--font-d);color:var(--bronze);background:var(--stone);
  min-height:40px;
}

/* ---------- pásik hodnosti ---------- */
.rankbar{
  display:flex;gap:8px;margin-bottom:14px;
}
.rankbar div{
  flex:1;background:var(--stone);border:1px solid var(--line);border-radius:4px;
  padding:9px 10px;min-width:0;
}
.rankbar .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.rankbar .v{font-family:var(--font-d);font-size:17px;font-weight:600;color:var(--bone);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}

/* ---------- karty ---------- */
.card{background:var(--stone);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px}
.card.order{border-color:var(--bronze-dim);border-top:3px solid var(--bronze)}
.card.warn{border-color:var(--blood);background:#1A1113}
.eyebrow{font-family:var(--font-d);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--bronze);margin-bottom:8px}
.bark{font-family:var(--font-d);font-size:19px;line-height:1.25;font-weight:600;letter-spacing:.02em;color:var(--bone)}
.ch-name{font-family:var(--font-d);font-size:26px;line-height:1.1;font-weight:700;color:var(--bone);margin:10px 0 8px}
.ch-desc{color:var(--bone);margin-bottom:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--font-d);padding:5px 9px;border-radius:3px;background:var(--stone-2);border:1px solid var(--line);color:var(--ash)}
.tag.b{color:var(--bronze);border-color:var(--bronze-dim)}
.why{border-left:3px solid var(--bronze-dim);padding:2px 0 2px 12px;color:var(--ash);font-size:15px;font-style:italic}
.safety{margin-top:12px;background:#17120F;border:1px solid var(--blood);border-radius:4px;padding:10px 12px;font-size:14px;color:#E8C9B6}
.safety b{color:var(--blood-bright)}

/* ---------- tlačidlá ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:60px;border-radius:5px;border:1px solid var(--line);
  background:var(--stone-2);color:var(--bone);
  font-family:var(--font-d);font-size:18px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:12px;margin-top:10px;
}
.btn:active{transform:translateY(1px)}
.btn.prim{background:var(--bronze);border-color:var(--bronze);color:#14100A}
.btn.red{background:var(--blood);border-color:var(--blood);color:var(--bone)}
.btn.ghost{background:transparent;color:var(--ash);min-height:52px;font-size:15px}
.btn.sm{min-height:48px;font-size:14px}
.btn:disabled{opacity:.4}
.btn:focus-visible,.modebtn:focus-visible,.nav button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn{margin-top:0}

/* ---------- formuláre ---------- */
label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);margin:14px 0 6px;font-family:var(--font-d)}
textarea,input[type=text],input[type=time],input[type=date],select{
  width:100%;background:var(--coal);border:1px solid var(--line);border-radius:4px;
  color:var(--bone);padding:12px;font-family:inherit;font-size:16px;min-height:52px;
}
textarea{min-height:84px;resize:vertical}

/* ---------- navigácia ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:25;
  background:#0E0F11;border-top:1px solid var(--line);
  display:flex;
  padding:0 max(8px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-right,0px));
}
.nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  min-height:68px;padding:8px 2px;color:var(--ash);
  font-family:var(--font-d);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  border-top:3px solid transparent;
}
.nav button[aria-current=page]{color:var(--bronze);border-top-color:var(--bronze)}
.nav svg{width:22px;height:22px;display:block}

/* ---------- štatistiky ---------- */
.catrow{display:flex;align-items:center;gap:10px;margin-top:12px}
.catrow .nmm{flex:0 0 96px;font-family:var(--font-d);font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ash)}
.bar{flex:1;height:14px;background:var(--stone-2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bronze)}
.catrow .nn{flex:0 0 52px;text-align:right;font-variant-numeric:tabular-nums;font-size:14px;color:var(--bone)}
.gridwrap{overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;width:max-content}
.cal i{width:12px;height:12px;border-radius:2px;background:#1A1C21}
.cal i.d{background:var(--bronze)}
.cal i.f{background:var(--blood)}
.cal i.t{box-shadow:0 0 0 2px var(--bone)}
.legend{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--ash);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend b{width:11px;height:11px;border-radius:2px;display:block}

/* ---------- denník ---------- */
.entry{border-bottom:1px solid var(--line);padding:14px 0}
.entry:last-child{border-bottom:none}
.entry .dt{font-family:var(--font-d);font-size:13px;letter-spacing:.1em;color:var(--bronze);text-transform:uppercase}
.entry .ti{font-family:var(--font-d);font-size:18px;margin:4px 0 6px;color:var(--bone)}
.entry .rf{font-size:14px;color:var(--ash);margin-top:8px;white-space:pre-wrap}
.entry .rf b{color:var(--bone);font-weight:600}
.badge{font-family:var(--font-d);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:3px}
.badge.d{background:var(--bronze);color:#14100A}
.badge.f{background:var(--blood);color:var(--bone)}

/* ---------- text ---------- */
.prose p{margin-bottom:12px;color:#D8D4CC}
.prose h3{font-size:17px;color:var(--bronze);margin:20px 0 8px}
.prose ul{margin:0 0 12px;padding-left:20px;color:#D8D4CC}
.prose li{margin-bottom:7px}
.quote{font-family:var(--font-d);font-size:21px;line-height:1.3;font-weight:500;color:var(--bone)}
.quote-src{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--bronze);margin-top:10px;font-family:var(--font-d)}
.quote-mean{margin-top:12px;color:var(--ash);font-size:15px}
.hint{font-size:13px;color:var(--ash);margin-top:8px}
.center{text-align:center}

/* ---------- prekrytia ---------- */
.ovl{position:fixed;inset:0;z-index:50;background:#070708;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.ovl-in{
  width:100%;max-width:420px;text-align:center;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.count{font-family:var(--font-d);font-size:92px;font-weight:700;line-height:1;color:var(--bronze);font-variant-numeric:tabular-nums}
.shield{width:132px;height:154px;margin:0 auto}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both}
  .fade{animation:fade .35s ease both}
}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;
  background:var(--stone-2);border:1px solid var(--bronze-dim);border-radius:4px;
  padding:12px 16px;font-size:14px;max-width:calc(100% - 32px);text-align:center;
}
.err{background:#1A1113;border:1px solid var(--blood);border-radius:4px;padding:12px;font-size:14px;color:#E8C9B6;margin-bottom:14px}
.sch{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.sch span{font-family:var(--font-d);font-size:13px;text-transform:uppercase;color:var(--ash)}
.sch select{min-height:48px;margin:0}

/* ---------- hodnosť, cieľ, prísaha, dôkaz ---------- */
.rankprog{display:flex;align-items:center;gap:11px;margin:0 0 14px;padding:10px 12px;background:var(--stone);border:1px solid var(--line);border-radius:4px}
.rankprog .txt{flex:1;min-width:0}
.rankprog .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.rankprog .bar{margin-top:6px}
.goalstrip{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:14px;padding:11px 14px;background:#15100F;border:1px solid var(--bronze-dim);border-radius:4px}
.goalstrip .g-n{font-family:var(--font-d);font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--bone)}
.goalstrip .g-d{font-family:var(--font-d);font-size:23px;line-height:1;color:var(--bronze);font-variant-numeric:tabular-nums}
.goalstrip .g-s{font-size:12px;color:var(--ash);flex-basis:100%}
.oathbox{border-left:3px solid var(--bronze);padding:3px 0 3px 14px;margin:14px 0;text-align:left}
.oathbox .o-l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--bronze)}
.oathbox .o-t{font-family:var(--font-d);font-size:19px;line-height:1.3;color:var(--bone);margin-top:5px}
.ladder .rk{display:flex;align-items:center;gap:10px;padding:9px 8px;border-bottom:1px solid var(--line)}
.ladder .rk:last-child{border-bottom:none}
.ladder .rk .nm{flex:1;font-family:var(--font-d);font-size:16px;text-transform:uppercase;letter-spacing:.04em;color:#6E6A63}
.ladder .rk .dd{font-size:12px;color:var(--ash);font-variant-numeric:tabular-nums}
.ladder .rk.past .nm{color:var(--ash)}
.ladder .rk.on{background:#17130D;border-radius:3px}
.ladder .rk.on .nm{color:var(--bronze)}
.proof .pr{border:1px solid var(--line);border-radius:4px;padding:12px;margin-top:10px}
.proof .pr .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--bronze)}
.proof .pr .tn{display:flex;align-items:center;gap:10px;margin-top:8px}
.proof .pr .th{flex:1;min-width:0;color:#6E6A63;font-size:14px}
.proof .pr .ar{color:var(--bronze);font-size:18px;flex:0 0 auto}
.proof .pr .nw{flex:1;min-width:0;color:var(--bone);font-size:15px;font-weight:600}
.win-day{font-family:var(--font-d);font-size:56px;line-height:1;font-weight:700;color:var(--bone);font-variant-numeric:tabular-nums}
.win-sub{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash);margin-top:5px}
.winbox{margin-top:14px;background:var(--stone);border:1px solid var(--line);border-radius:5px;padding:14px;text-align:left}
.winbox.gold{border-color:var(--bronze)}
@media (prefers-reduced-motion:no-preference){
  .s2{animation:fade .4s ease .3s both}
  .s3{animation:fade .4s ease .6s both}
  .s4{animation:fade .4s ease .9s both}
  .strike{animation:strike .65s cubic-bezier(.2,.9,.3,1.2) both}
}
@keyframes strike{0%{transform:scale(.45) rotate(-10deg);opacity:0}55%{transform:scale(1.12) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
</style>

<div id="app">
  <header class="top">
    <svg class="crest" viewBox="0 0 34 40" aria-hidden="true">
      <path d="M17 1 2 6v14c0 9 7 15.5 15 19 8-3.5 15-10 15-19V6L17 1z" fill="#1D1F24" stroke="#C08E45" stroke-width="1.6"/>
      <path d="M17 7v24" stroke="#8A6630" stroke-width="1.2"/>
      <path d="M8 13h18M9.5 20h15" stroke="#8A6630" stroke-width="1.2"/>
    </svg>
    <div class="brand">
      <div class="nm">AGOGÉ</div>
      <div class="sub">Spartánsky denník</div>
    </div>
    <button class="modebtn" id="modeBtn" type="button">–</button>
  </header>

  <div id="storeErr" hidden class="err"></div>

  <div class="rankbar">
    <div><div class="k">Hodnosť</div><div class="v" id="hRank">–</div></div>
    <div><div class="k">Séria</div><div class="v" id="hStreak">–</div></div>
    <div><div class="k">Splnené</div><div class="v" id="hTotal">–</div></div>
  </div>
  <div class="rankprog" id="rankProg"></div>

  <main id="vDnes"></main>
  <main id="vDennik" hidden></main>
  <main id="vStat" hidden></main>
  <main id="vInfo" hidden></main>
</div>

<nav class="nav" aria-label="Hlavná navigácia">
  <button type="button" data-v="Dnes" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 2 3 5v8c0 5.5 4.2 9.3 9 11 4.8-1.7 9-5.5 9-11V5l-9-3z"/><path d="M12 7v9M8 11h8"/></svg>
    Dnes
  </button>
  <button type="button" data-v="Dennik">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2V3z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>
    Denník
  </button>
  <button type="button" data-v="Stat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H3"/></svg>
    Postup
  </button>
  <button type="button" data-v="Info">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.2"/></svg>
    Prečo
  </button>
</nav>

<div id="ovl"></div>
<div id="toast"></div>

<script>
"use strict";
/* ===================================================================
   AGOGÉ – Spartánsky denník
   Jeden súbor, žiadne externé dáta. Všetko sa ukladá v tomto prehliadači.
   =================================================================== */

/* ---------- 1. DATABÁZA VÝZIEV (60) -------------------------------
   c  = kategória: A telo a chlad / B disciplína a pôst / C myseľ a zvyky
   l  = úroveň 1–3
   p  = miesto: 'vsade' | 'ubytovna' (dá sa aj na ubytovni v Nemecku) | 'doma'
   f  = pôst (nedávať v deň silového alebo tvrdého/dlhého behu)
   h  = fyzicky náročné (nedávať v deň silového alebo tvrdého tréningu)
   s  = bezpečnostná poznámka
------------------------------------------------------------------- */
var COLD = "Chlad budujeme postupne. Nikdy nezadržuj dych pod vodou a nikdy sa neotužuj sám v rieke, jazere alebo bazéne. Keď ti tuhnú ruky alebo sa nekontrolovane trasieš, skonči.";
var FAST = "Pôst nikdy v deň silového tréningu, intervalov ani dlhého behu. Pi vodu. Keď sa ti krúti hlava alebo vynecháva výkon v práci, najedz sa.";
var PAIN = "Nepohodlie áno, bolesť nie. Keď niečo ostro bolí, prestaň.";

var CH = [
/* ===== A) TELO A CHLAD – úroveň 1 ===== */
{id:"A1",c:"A",l:1,p:"ubytovna",t:"Studená voda 30 sekúnd",d:"Osprchuj sa normálne teplou vodou. Na konci otoč na úplne studenú a vydrž 30 sekúnd. Dýchaj pomaly nosom, ramená dole, nekrič.",dur:"30 sekúnd",w:"Naučíš telo, že nepríjemné sa dá prežiť v pokoji – a to sa prenesie do celého dňa.",s:COLD},
{id:"A2",c:"A",l:1,p:"vsade",t:"Prechádzka v zlom počasí",d:"Obleč sa, vypni slúchadlá, mobil nechaj v kapse. 15 minút chôdze v tom, čo je za oknom – dážď, vietor, zima, tma.",dur:"15 minút",w:"Keď prestaneš čakať na dobré podmienky, prestaneš mať výhovorky.",s:""},
{id:"A3",c:"A",l:1,p:"vsade",t:"Celý deň len schody",d:"Dnes ani raz výťah. Ani v práci, ani v obchode, ani na ubytovni. Každé schody vyjdi pešo.",dur:"celý deň",w:"Malé rozhodnutie zopakované dvadsaťkrát za deň je silnejšie ako jedno veľké.",s:""},
{id:"A4",c:"A",l:1,p:"ubytovna",t:"Podrep pri stene 3× 30 sekúnd",d:"Oprete sa chrbtom o stenu, stehná vodorovne, kolená nad chodidlami. 30 sekúnd výdrž, minúta pauza, trikrát.",dur:"5 minút",w:"Naučíš sa ostať v nepohodlí aj vtedy, keď ti hlava hovorí „dosť“.",s:PAIN},
{id:"A5",c:"A",l:1,p:"ubytovna",t:"Poloha na lakťoch 3× 30 sekúnd",d:"Predloktia na zemi, telo v jednej priamke, zadok nedvíhaj. 30 sekúnd, minúta pauza, trikrát.",dur:"5 minút",w:"Odolnosť sa cvičí v sekundách, keď je to najnepríjemnejšie.",s:PAIN},
{id:"A6",c:"A",l:1,p:"ubytovna",t:"20 klikov hneď po prebudení",d:"Nohy na zemi, žiadny mobil, žiadna káva. Prvá vec dňa je 20 klikov. Môžeš aj v niekoľkých sériách.",dur:"2 minúty",w:"Prvý krok dňa rozhoduje, kto dnes vedie – ty alebo pohodlie.",s:""},
{id:"A7",c:"A",l:1,p:"ubytovna",t:"Studená tvár a šija",d:"Pusti studenú vodu na tvár, zápästia a zadnú časť šije. 60 sekúnd striedavo. Dýchaj pomaly.",dur:"2 minúty",w:"Naučíš sa upokojiť telo zámerne, nie len čakať, kým sa upokojí samo.",s:COLD},

/* ===== A) úroveň 2 ===== */
{id:"A8",c:"A",l:2,p:"ubytovna",t:"Studená sprcha 60 sekúnd",d:"Na konci sprchy otoč na studenú a vydrž celú minútu. Nechaj vodu tiecť aj na chrbát a šiju, nie len na nohy.",dur:"60 sekúnd",w:"Keď si ráno dobrovoľne vyberieš nepohodlie, zvyšok dňa ti už toľko nehýbe.",s:COLD},
{id:"A9",c:"A",l:2,p:"vsade",t:"Beh 20 minút bez slúchadiel",d:"Žiadna hudba, žiadny podcast. Len tvoj dych a kroky. Pomalé tempo stačí – ide o ticho, nie o výkon.",dur:"20 minút",w:"Keď nemáš čím prehlušiť nepohodlie, naučíš sa byť v ňom.",s:""},
{id:"A10",c:"A",l:2,p:"ubytovna",t:"Kliky do zlyhania",d:"Jedna séria klikov, kým ti drží forma. Keď sa začne prehýbať zadok alebo klesať hlava, skonči. Zapíš si počet.",dur:"3 minúty",h:true,w:"Naučíš sa poznať rozdiel medzi „nechce sa mi“ a „už naozaj nemôžem“.",s:PAIN},
{id:"A11",c:"A",l:2,p:"doma",t:"Bosé chodenie po rose",d:"Vyjdi na dvor alebo do trávy bosý. 10 minút chôdze – ráno v rose alebo večer v mokrej tráve.",dur:"10 minút",w:"Chodidlá a chlad ťa vrátia do tela a vypnú hlavu bez jediného slova.",s:"Pozor na sklo, kamene a ostré veci. Pri rannom mraze maximálne 2–3 minúty."},
{id:"A12",c:"A",l:2,p:"ubytovna",t:"Podrep pri stene 2× 60 sekúnd",d:"Stehná vodorovne, chrbát na stene, ruky nepodopierajú. Minútu vydrž, dve minúty pauza, ešte raz.",dur:"6 minút",w:"Posledných pätnásť sekúnd je celý tréning – tam sa láme vôľa.",s:PAIN},
{id:"A13",c:"A",l:2,p:"vsade",t:"Pešo namiesto auta",d:"Jednu dnešnú cestu, ktorú by si išiel autom, choď pešo. Aspoň 25 minút chôdze, bez slúchadiel.",dur:"25 minút",w:"Pohodlie je tichý zlodej. Dnes mu jednu cestu nedáš.",s:""},
{id:"A14",c:"A",l:2,p:"ubytovna",t:"Poloha na lakťoch 3× 60 sekúnd",d:"Telo v priamke, brucho vtiahnuté, dýchaj. Minútu výdrž, minútu pauza, trikrát.",dur:"7 minút",h:true,w:"Odolnosť nie je o sile. Je o tom, že neustúpiš, keď to začne páliť.",s:PAIN},
{id:"A15",c:"A",l:2,p:"ubytovna",t:"100 klikov počas dňa",d:"Rozdeľ si 100 klikov do celého dňa. Po 10, po 20, kedykoľvek. Večer musí byť stovka hotová.",dur:"15 minút spolu",h:true,w:"Veľké čísla sa nerobia naraz. Robia sa tým, že sa k nim vraciaš.",s:PAIN},

/* ===== A) úroveň 3 ===== */
{id:"A16",c:"A",l:3,p:"ubytovna",t:"Celá sprcha studená",d:"Žiadna teplá voda. Vstúp do studenej a vydrž 2 až 3 minúty. Dýchaj pomaly nosom, nezadržuj dych.",dur:"2–3 minúty",w:"Prvých desať sekúnd je panika. Keď ich zvládneš v pokoji, zvládneš aj ten zvyšok života.",s:COLD},
{id:"A17",c:"A",l:3,p:"vsade",t:"30 minút behu v nečase",d:"Dážď, vietor, zima. Bez slúchadiel. 30 minút pokojným tempom. Nie je to tréning, je to rozhodnutie.",dur:"30 minút",w:"Kto beží aj vtedy, keď sa mu nechce, nepotrebuje motiváciu.",s:"V mraze a vlhku si chráň ruky a uši. Po príchode sa hneď prezleč do suchého."},
{id:"A18",c:"A",l:3,p:"doma",t:"Pochod s batohom 45 minút",d:"Batoh 8–10 kg (voda, piesok, knihy). 45 minút rýchlej chôdze v teréne, bez slúchadiel, bez prestávky.",dur:"45 minút",h:true,w:"Záťaž na chrbte ťa naučí, že sa dá ísť ďalej aj keď je ťažko.",s:"Batoh musí sedieť na chrbte, nie visieť na ramenách. Pri bolesti chrbta alebo kolien ukonči."},
{id:"A19",c:"A",l:3,p:"ubytovna",t:"Blok výdrže",d:"Podrep pri stene 3× 90 sekúnd a poloha na lakťoch 3× 60 sekúnd. Striedaj ich, medzi sériami minúta pauza.",dur:"15 minút",h:true,w:"Telo sa vzdáva až dávno po tom, čo sa vzdá hlava. Dnes to zistíš.",s:PAIN},
{id:"A20",c:"A",l:3,p:"ubytovna",t:"Ranný blok bez pohodlia",d:"Hneď po budíku: 5 minút rozcvička, 30 klikov, potom 90 sekúnd studenej sprchy. V tomto poradí, bez mobilu.",dur:"15 minút",w:"Keď prvých pätnásť minút dňa vyhráš, deň už nemá čím ťa zlomiť.",s:COLD},

/* ===== B) DISCIPLÍNA A PÔST – úroveň 1 ===== */
{id:"B1",c:"B",l:1,p:"ubytovna",t:"Prvý budík, nohy na zemi",d:"Žiadny odklad. Budík zazvoní, do piatich sekúnd si na nohách a stojíš. Telefón nechaj ležať.",dur:"5 sekúnd",w:"Prvé rozhodnutie dňa si urobil ty, nie tvoja únava.",s:""},
{id:"B2",c:"B",l:1,p:"ubytovna",t:"Deň bez pridaného cukru",d:"Žiadne sladkosti, keksy, sladené nápoje, čokoláda ani cukor do kávy. Ovocie a normálne jedlo áno.",dur:"celý deň",w:"Cukor je najčastejšia malá kapitulácia dňa. Keď ju vynecháš, vidíš, kto tu rozhoduje.",s:""},
{id:"B3",c:"B",l:1,p:"ubytovna",t:"Prvých 30 minút bez mobilu",d:"Po prebudení 30 minút žiadna obrazovka. Žiadne správy, žiadne správy zo sveta. Len ty, voda a rozcvička.",dur:"30 minút",w:"Keď ráno nepustíš cudzie hlasy do hlavy, celý deň myslíš po svojom.",s:""},
{id:"B4",c:"B",l:1,p:"ubytovna",t:"Jedno jedlo bez obrazovky",d:"Jedno dnešné jedlo zjedz bez telefónu, bez televízora, bez videa. Sedíš, ješ, cítiš, čo ješ.",dur:"20 minút",w:"Keď sa naučíš byť pri jedle, naučíš sa byť aj pri ťažších veciach.",s:""},
{id:"B5",c:"B",l:1,p:"ubytovna",t:"Pôst 12 hodín",d:"Posledné jedlo napríklad o 20:00, prvé o 08:00. Medzitým len voda, čierna káva alebo čaj bez cukru.",dur:"12 hodín",f:true,w:"Hlad nie je nepriateľ. Je to pocit, ktorý príde a odíde – a ty medzitým robíš svoje.",s:FAST},
{id:"B6",c:"B",l:1,p:"ubytovna",t:"30 minút pred spaním bez obrazovky",d:"Poslednú polhodinu dňa žiadny telefón. Odlož ho mimo dosah ruky. Namiesto toho kniha, zápisník alebo ticho.",dur:"30 minút",w:"Ako končíš deň, tak začínaš ten ďalší.",s:""},
{id:"B7",c:"B",l:1,p:"ubytovna",t:"Prvá káva až po 10:00",d:"Do desiatej len voda. Káva nie je zakázaná, len odložená. Všimni si, čo ti telo hovorí medzitým.",dur:"dopoludnia",w:"Keď raz odložíš niečo, čo chceš hneď, ovládaš sa aj inde.",s:""},

/* ===== B) úroveň 2 ===== */
{id:"B8",c:"B",l:2,p:"ubytovna",t:"Mobil až po 9:00",d:"Žiadna obrazovka do deviatej. Hovory áno, keď treba kvôli práci. Žiadne appky, žiadne správy, žiadne video.",dur:"do 9:00",w:"Prvé tri hodiny dňa patria tebe. Nikomu inému.",s:""},
{id:"B9",c:"B",l:2,p:"ubytovna",t:"Pôst 14 hodín",d:"Napríklad od 19:00 do 09:00. Len voda, čierna káva alebo čaj bez cukru. Ráno nič, kým neuplynie čas.",dur:"14 hodín",f:true,w:"Naučíš sa, že nemusíš okamžite vyhovieť každému nutkaniu.",s:FAST},
{id:"B10",c:"B",l:2,p:"ubytovna",t:"Deň bez cukru a sladkých nápojov",d:"Žiadny pridaný cukor, žiadne sladené a energetické nápoje, žiadne biele pečivo a sladké mliečne výrobky.",dur:"celý deň",w:"Keď si deň uvaríš sám, prestaneš byť v ňom návštevou.",s:""},
{id:"B11",c:"B",l:2,p:"ubytovna",t:"Studená voda namiesto kávy do obeda",d:"Do obeda žiadna káva, žiadny energeťák. Len studená voda. Dopoludnia funguješ na sebe, nie na kofeíne.",dur:"dopoludnia",w:"Uvidíš, koľko z tvojej energie je naozaj tvoja.",s:"Ak si zvyknutý na veľa kávy, prvý deň môže bolieť hlava. Pi viac vody. Pri silnom nepokoji si kávu daj."},
{id:"B12",c:"B",l:2,p:"ubytovna",t:"Deň bez sociálnych sietí",d:"Celý deň žiadny Facebook, Instagram, TikTok, YouTube na scrollovanie. Appky zmaž z plochy alebo vypni notifikácie.",dur:"celý deň",w:"Keď prestaneš pozerať na cudzie životy, zostane ti čas na svoj.",s:""},
{id:"B13",c:"B",l:2,p:"ubytovna",t:"Všetky jedlá bez obrazovky",d:"Dnes každé jedlo bez telefónu a televízora. Sadneš, odložíš mobil mimo dosah, ješ.",dur:"celý deň",w:"Pozornosť je tvoj najdrahší nástroj. Dnes ju nerozdáš zadarmo.",s:""},
{id:"B14",c:"B",l:2,p:"ubytovna",t:"Mobil v inej miestnosti na noc",d:"Od 21:00 je telefón mimo spálne. Budík si nastav na mobile v inej miestnosti alebo si kúp obyčajný budík.",dur:"celú noc",w:"Keď prvá vec po prebudení nie je obrazovka, ráno patrí tebe.",s:""},

/* ===== B) úroveň 3 ===== */
{id:"B15",c:"B",l:3,p:"ubytovna",t:"Pôst 16 hodín",d:"Napríklad od 19:00 do 11:00. Len voda, čierna káva alebo čaj. Rob svoje veci, nesleduj hodiny.",dur:"16 hodín",f:true,w:"Keď vydržíš bez toho, čo si zvyknutý mať hneď, prestaneš byť riadený zvykom.",s:FAST},
{id:"B16",c:"B",l:3,p:"ubytovna",t:"Deň bez cukru, alkoholu a kofeínu",d:"Celý deň žiadny pridaný cukor, žiadny alkohol, žiadna káva ani energeťák. Voda, jedlo, práca.",dur:"celý deň",w:"Deň bez chemických pomôcok ti ukáže tvoju skutočnú úroveň.",s:"Ak piješ denne veľa kávy, priprav sa na bolesť hlavy. Pi veľa vody. Toto nie je deň na tvrdý tréning."},
{id:"B17",c:"B",l:3,p:"ubytovna",t:"Mobil len na telefonovanie",d:"Celý deň telefón slúži len na hovory a pracovné správy. Žiadne appky, žiadne prehliadanie, žiadne video.",dur:"celý deň",w:"Zistíš, že väčšina toho, čo „musíš“ pozrieť, nebola potrebná.",s:""},
{id:"B18",c:"B",l:3,p:"ubytovna",t:"Vstať o 5:30 a hneď pracovať na sebe",d:"Budík 5:30, žiadny odklad. Prvých 20 minút práca na sebe: čítanie, plán, rozcvička. Mobil až potom.",dur:"20 minút",w:"Ráno je jediný čas, ktorý ti nikto nevezme – ak si ho vezmeš prvý.",s:"Ak si včera spal menej ako 6 hodín, vynechaj to a dnes si poď skôr ľahnúť. Spánok nie je slabosť."},
{id:"B19",c:"B",l:3,p:"vsade",t:"Bez mobilu do 12:00",d:"Celé dopoludnie žiadna obrazovka. Hovory len keď naozaj treba kvôli práci. Žiadne správy, žiadne appky.",dur:"do obeda",w:"Polovicu dňa zvládneš bez toho, čo si považoval za nevyhnutné.",s:""},
{id:"B20",c:"B",l:3,p:"ubytovna",t:"Tvrdý deň disciplíny",d:"Pôst 16 hodín, žiadny pridaný cukor a všetky jedlá bez obrazovky. Tri pravidlá, jeden deň, bez výnimky.",dur:"celý deň",f:true,w:"Keď zvládneš tri pravidlá naraz, prestaneš veriť, že jedno je príliš.",s:FAST},

/* ===== C) MYSEĽ A ZVYKY – úroveň 1 ===== */
{id:"C1",c:"C",l:1,p:"ubytovna",t:"5 minút v tichu",d:"Sadni si, nastav si časomieru na 5 minút a nerob nič. Žiadna hudba, žiadny mobil. Myšlienky nechaj prejsť.",dur:"5 minút",w:"Kto vydrží sám so sebou päť minút, nemusí utekať pred vlastnou hlavou.",s:""},
{id:"C2",c:"C",l:1,p:"ubytovna",t:"Tri strachy a tri kroky",d:"Napíš na papier tri veci, z ktorých máš teraz strach. Ku každej jeden malý krok, ktorý vieš urobiť tento týždeň.",dur:"10 minút",w:"Strach napísaný na papieri sa zmenší. Strach v hlave rastie.",s:""},
{id:"C3",c:"C",l:1,p:"ubytovna",t:"Čo sa dnes môže pokaziť",d:"Napíš tri veci, ktoré sa dnes môžu pokaziť. Ku každej jednu vetu: ako na to zareagujem. Nič viac.",dur:"10 minút",w:"Keď si nešťastie predstavíš vopred, nezaskočí ťa – a ty si už vybral, ako odpovieš.",s:""},
{id:"C4",c:"C",l:1,p:"ubytovna",t:"10 strán knihy",d:"Papierová kniha alebo čítačka, nie telefón. Desať strán bez prerušenia. Mobil v inej miestnosti.",dur:"15 minút",w:"Súvislá pozornosť je sila, ktorá sa stráca zo sveta. Ty si ju dnes udržíš.",s:""},
{id:"C5",c:"C",l:1,p:"vsade",t:"Najnepríjemnejšia vec ako prvá",d:"Napíš si, čo je dnes najnepríjemnejšia úloha. Urob ju ako prvú, pred všetkým ostatným. Hneď.",dur:"podľa úlohy",w:"To, čo odkladáš, ťa ťahá celý deň. Keď to zvládneš ráno, deň je zrazu ľahký.",s:""},
{id:"C6",c:"C",l:1,p:"ubytovna",t:"Jeden sľub sebe",d:"Ráno napíš jednu vetu – jeden malý sľub na dnes. Večer sa k nej vráť a priznaj si, či si ho dodržal.",dur:"5 minút",w:"Dôvera v seba sa buduje z dodržaných malých sľubov, nie z veľkých plánov.",s:""},
{id:"C7",c:"C",l:1,p:"ubytovna",t:"Večer 5 minút ticha",d:"Pred spaním päť minút bez obrazovky a bez hudby. Sedíš alebo ležíš a necháš deň dobehnúť.",dur:"5 minút",w:"Keď deň uzavrieš sám, neuzavrie ho za teba cudzie video.",s:""},

/* ===== C) úroveň 2 ===== */
{id:"C8",c:"C",l:2,p:"ubytovna",t:"10 minút v tichu",d:"Desať minút bez podnetov. Len sedíš a dýchaš. Keď myšlienka príde, všimni si ju a nechaj ju prejsť.",dur:"10 minút",w:"Ticho je najnepríjemnejšia vec pre nepokojnú hlavu – a najlepší tréning pre ňu.",s:""},
{id:"C9",c:"C",l:2,p:"ubytovna",t:"20 strán knihy",d:"Dvadsať strán naraz, bez telefónu v dosahu ruky. Keď sa ti myseľ vzpiera, čítaj ďalej.",dur:"25 minút",w:"Dvadsať strán denne je tridsaťtri kníh za rok. Odolnosť sa počíta v opakovaniach.",s:""},
{id:"C10",c:"C",l:2,p:"ubytovna",t:"Čo mám a čo nemám pod kontrolou",d:"Rozdeľ papier na dve polovice. Vľavo napíš, čo ťa teraz ťaží a nemáš pod kontrolou. Vpravo to, čo pod kontrolou máš.",dur:"10 minút",w:"Epiktétos: trápime sa najviac vecami, s ktorými nemôžeme nič urobiť. Dnes ich rozlíšiš.",s:""},
{id:"C11",c:"C",l:2,p:"vsade",t:"Jedna odložená vec celá",d:"Vyber jednu vec, ktorú odkladáš už viac ako týždeň. Dnes ju dokonči celú. Nie začni – dokonči.",dur:"podľa úlohy",w:"Každá odložená vec ti berie energiu potichu. Jedna dokončená ti ju vráti celú.",s:""},
{id:"C12",c:"C",l:2,p:"ubytovna",t:"List sebe o päť rokov",d:"Napíš ručne list sebe o päť rokov. Čo chceš, aby bolo pravda. Čo preto dnes robíš. Krátko a bez fráz.",dur:"15 minút",w:"Keď vieš, kam ideš, prestaneš sa hádať sám so sebou o každom kroku.",s:""},
{id:"C13",c:"C",l:2,p:"vsade",t:"Deň bez sťažovania",d:"Celý deň sa ani raz nahlas nesťažuj. Na počasie, prácu, ľudí, nič. Keď ti to ujde, zapíš si to.",dur:"celý deň",w:"Sťažovanie je zvyk, nie pravda. Keď ho vypneš, zistíš, čo sa dá naozaj zmeniť.",s:""},
{id:"C14",c:"C",l:2,p:"ubytovna",t:"Zajtrajšok na papier",d:"Večer 10 minút: napíš tri veci, ktoré zajtra naozaj urobíš, a kedy. Nie zoznam želaní – plán.",dur:"10 minút",w:"Ráno nemá byť čas na rozhodovanie. Má byť čas na konanie.",s:""},

/* ===== C) úroveň 3 ===== */
{id:"C15",c:"C",l:3,p:"ubytovna",t:"20 minút v tichu",d:"Dvadsať minút bez podnetov. Žiadna hudba, žiadny mobil, žiadne čítanie. Len ty a tvoja hlava.",dur:"20 minút",w:"Kto vydrží dvadsať minút sám so sebou, nepotrebuje už nič prehlušovať.",s:""},
{id:"C16",c:"C",l:3,p:"ubytovna",t:"Najhorší týždeň na papieri",d:"Napíš, čo najhoršie sa môže tento týždeň stať – v práci, s domom, s rodinou, so zdravím. Ku každému bodu konkrétny plán.",dur:"15 minút",w:"Stoici to robili zámerne: kto si nešťastie predstavil vopred, nestratí hlavu, keď príde.",s:"Ak ťa to zmení na úzkosť namiesto plánu, skonči a napíš len jednu vec, ktorú dnes vieš urobiť."},
{id:"C17",c:"C",l:3,p:"ubytovna",t:"30 strán knihy",d:"Tridsať strán v jednom sedení. Mobil v inej miestnosti. Keď sa stratíš, vráť sa o odsek a čítaj znova.",dur:"40 minút",w:"Hlboká pozornosť je dnes vzácnejšia ako sila. Dnes ju trénuješ naplno.",s:""},
{id:"C18",c:"C",l:3,p:"vsade",t:"Deň bez sťažovania a výhovoriek",d:"Nesťažuj sa a nevymlúvaj sa. Pri každej výhovorke, ktorá ti ujde, si ju zapíš do mobilu alebo na papier.",dur:"celý deň",w:"Keď vidíš svoje výhovorky napísané, prestanú ti znieť rozumne.",s:""},
{id:"C19",c:"C",l:3,p:"vsade",t:"Rozhovor, ktorý odkladáš",d:"Je jeden rozhovor, ktorý odkladáš – doma, v práci, s niekým blízkym. Dnes ho začni ty. Krátko, priamo, bez obvinení.",dur:"podľa rozhovoru",w:"Veci, ktorým sa vyhýbaš, určujú tvoj život viac ako tie, ktoré robíš.",s:""},
{id:"C20",c:"C",l:3,p:"doma",t:"Hodina bez obrazoviek po prebudení",d:"Prvú hodinu dňa žiadna obrazovka. Zápisník, plán dňa, ticho, rozcvička. Telefón zapneš až po hodine.",dur:"60 minút",w:"Kto vlastní prvú hodinu dňa, vlastní celý deň.",s:""}
];

/* ---------- 7. DÁTUMY ---------- */
function key(d){
  var y=d.getFullYear(),m=d.getMonth()+1,dd=d.getDate();
  return y+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd;
}
function today(){return key(new Date());}
function shiftKey(k,n){var p=k.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return key(d);}
function weekKey(d){
  var t=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  var day=(t.getDay()+6)%7;
  t.setDate(t.getDate()-day);
  return key(t);
}
function prettyDate(k){
  var p=k.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);
  return DAYNAME[d.getDay()]+" "+(+p[2])+". "+(+p[1])+". "+p[0];
}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return Math.abs(h);}
function toMin(s){var p=String(s||"0:0").split(":");return (+p[0]||0)*60+(+p[1]||0);}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes();}
function fmtLeft(m){var h=Math.floor(m/60),x=m%60;return (h>0?h+" h ":"")+x+" min";}

/* pripomienky v prehliadači – fungujú len kým je appka otvorená */
function notifSupported(){try{return typeof Notification!=="undefined"&&typeof Notification.requestPermission==="function";}catch(e){return false;}}
function askNotif(){
  if(!notifSupported()){toast("Tento prehliadač pripomienky neponúka.");return;}
  try{
    var p=Notification.requestPermission(function(res){handleNotifPerm(res);});
    if(p&&typeof p.then==="function")p.then(handleNotifPerm,function(){toast("Prehliadač pripomienky nepovolil.");});
  }catch(e){toast("Tento prehliadač pripomienky neponúka.");}
}
function handleNotifPerm(res){
  if(res==="granted"){S.remind.notif=true;save();render();toast("Pripomienky zapnuté – kým je appka otvorená.");}
  else{S.remind.notif=false;save();render();toast("Prehliadač pripomienky nepovolil.");}
}

  try{if(Notification.permission==="granted")new Notification(title,{body:body});}catch(e){}
}

/* ---------- 8. VÝBER VÝZVY ---------- */
function dayRec(k){return S.days[k]||null;}
function allDayKeys(){return Object.keys(S.days).sort();}

function recentIds(n){
  var out=[],k=today();
  for(var i=1;i<=n;i++){
    var r=S.days[shiftKey(k,-i)];
    if(r&&r.id)out.push(r.id);
  }
  return out;
}
function nextCat(){
  var ks=allDayKeys();
  for(var i=ks.length-1;i>=0;i--){
    var r=S.days[ks[i]];
    if(r&&r.cat){
      var idx=CATORDER.indexOf(r.cat);
      return CATORDER[(idx+1)%3];
    }
  }
  return "A";
}
function placeOk(c){
  if(c.p==="vsade")return true;
  if(S.mode==="nemecko")return c.p==="ubytovna";
  return true;
}
function safeOk(c,training){
  if(!training)return true;
  if(!HARD[training])return true;
  return !c.f && !c.h;
}
function pick(cat,training,excl){
  excl=excl||[];
  var recent=recentIds(14);
  var lvl=S.levels[cat];
  function f(useRecent,exactLvl){
    return CH.filter(function(c){
      if(c.c!==cat)return false;
      if(!placeOk(c))return false;
      if(!safeOk(c,training))return false;
      if(excl.indexOf(c.id)>=0)return false;
      if(useRecent&&recent.indexOf(c.id)>=0)return false;
      if(exactLvl)return c.l===lvl;
      return c.l<=lvl;
    });
  }
  var pool=f(true,true);
  if(!pool.length)pool=f(true,false);
  if(!pool.length)pool=f(false,false);
  if(!pool.length)pool=CH.filter(function(c){return c.c===cat&&safeOk(c,training)&&excl.indexOf(c.id)<0;});
  if(!pool.length)pool=CH.filter(function(c){return c.c===cat;});
  var h=hash(today()+cat+excl.length);
  return pool[h%pool.length];
}
function chById(id){
  for(var i=0;i<CH.length;i++)if(CH[i].id===id)return CH[i];
  for(var j=0;j<WEEKLY.length;j++)if(WEEKLY[j].id===id)return WEEKLY[j];
  return null;
}
function quoteOfDay(){return QUOTES[hash(today()+"q")%QUOTES.length];}
function barkOfDay(){return BARKS[hash(today()+"b")%BARKS.length];}

/* dôkaz, že sa meníš – iba z reálnych dát */
function doneInWindow(fromK,toK){
  var c=0;
  for(var k in S.days){if(k>=fromK&&k<=toK&&S.days[k].status==="done")c++;}
  return c;
}
function hardestDone(){
  var best=null,bestK=null;
  for(var k in S.days){
    var r=S.days[k];
    if(r.status!=="done")continue;
    var ch=chById(r.id);
    if(!ch||!ch.l)continue;
    if(!best||ch.l>best.l||(ch.l===best.l&&k>bestK)){best=ch;bestK=k;}
  }
  return best?{ch:best,k:bestK}:null;
}
function proofOfChange(){
  var out=[],ks=allDayKeys();
  if(!ks.length)return out;
  var first=ks[0],firstR=S.days[first],firstC=chById(firstR.id);
  var tk=today(),tr=S.days[tk],tc=tr?chById(tr.id):null;
  if(firstC&&tc&&first!==tk&&(tc.l||1)>=(firstC.l||1)){
    out.push({l:"Prvý rozkaz a dnešný",th:firstC.t+" · úroveň "+(firstC.l||1),nw:tc.t+" · úroveň "+(tc.l||1)});
  }
  var prev=doneInWindow(shiftKey(tk,-59),shiftKey(tk,-30));
  var now=doneInWindow(shiftKey(tk,-29),tk);
  if(prev>0||now>0){
    out.push({l:"Posledných 30 dní proti predošlým 30",th:prev+" z 30",nw:now+" z 30"});
  }
  var lv=S.levels.A+S.levels.B+S.levels.C;
  if(lv>3){
    out.push({l:"Úroveň výziev",th:"3 body na začiatku",nw:lv+" bodov teraz"});
  }
  var hd=hardestDone();
  if(hd&&hd.ch.l>1){
    out.push({l:"Najtvrdšie, čo si zvládol",th:"úroveň 1 na štarte",nw:hd.ch.t+" · úroveň "+hd.ch.l});
  }
  return out.slice(0,4);
}

/* nedeľné zúčtovanie týždňa */
function weekStats(){
  var tk=today(),d=0,f=0,hard="",by={A:0,B:0,C:0};
  for(var i=0;i<7;i++){
    var k=shiftKey(tk,-i),r=S.days[k];
    if(!r)continue;
    if(r.status==="done"){d++;if(by[r.cat]!==undefined)by[r.cat]++;}
    if(r.status==="fail")f++;
    if(!hard&&r.ref&&r.ref.q1)hard=r.ref.q1;
  }
  var weakest="A",wmin=99;
  for(var c in by){if(S.levels[c]*10+by[c]<wmin){wmin=S.levels[c]*10+by[c];weakest=c;}}
  return {done:d,fail:f,hard:hard,weakest:weakest};
}

/* ---------- 9. POČTY ---------- */
function totalDone(){
  var n=0;for(var k in S.days){if(S.days[k].status==="done")n++;}
  if(S.weeks)for(var w in S.weeks){if(S.weeks[w].status==="done")n++;}
  return n;
}
function dayDone(){var n=0;for(var k in S.days){if(S.days[k].status==="done")n++;}return n;}
function doneByCat(){
  var o={A:0,B:0,C:0};
  for(var k in S.days){var r=S.days[k];if(r.status==="done"&&o[r.cat]!==undefined)o[r.cat]++;}
  return o;
}
function currentStreak(){
  var k=today(),n=0;
  if(!S.days[k]||S.days[k].status!=="done")k=shiftKey(k,-1);
  while(S.days[k]&&S.days[k].status==="done"){n++;k=shiftKey(k,-1);}
  return n;
}
function longestStreak(){
  var ks=allDayKeys().filter(function(k){return S.days[k].status==="done";});
  if(!ks.length)return 0;
  var best=1,run=1;
  for(var i=1;i<ks.length;i++){
    if(shiftKey(ks[i-1],1)===ks[i])run++;else run=1;
    if(run>best)best=run;
  }
  return best;
}
function yesterdayFailed(){
  var r=S.days[shiftKey(today(),-1)];
  return !!(r&&r.status==="fail");
}

/* ---------- 10. AKCIE ---------- */
function setTraining(t){
  var k=today();
  var r=S.days[k]||{};
  r.training=t;
  if(!r.id){
    var cat=nextCat();
    var c=pick(cat,t,[]);
    r.cat=cat;r.id=c.id;r.swaps=0;
  }else{
    var cur=chById(r.id);
    if(cur&&!safeOk(cur,t)){
      var c2=pick(r.cat,t,[cur.id]);
      r.id=c2.id;
      toast("Dnes máš "+TRAINING[t].toLowerCase()+". Výzvu som kvôli bezpečnosti vymenil.");
    }
  }
  S.days[k]=r;save();render();
}
function swap(){
  var k=today(),r=S.days[k];
  if(!r||r.swaps>=1)return;
  var c=pick(r.cat,r.training,[r.id]);
  r.id=c.id;r.swaps=1;S.days[k]=r;save();render();
  toast("Výmena použitá. Dnes už len táto.");
}
function finish(status){
  var k=today(),r=S.days[k];
  if(!r)return;
  var beforeRank=rankOf(totalDone()).n;
  r.status=status;
  var leveled=false;
  if(status==="done"){
    S.catStreak[r.cat]=(S.catStreak[r.cat]||0)+1;
    if(S.catStreak[r.cat]>=5&&S.levels[r.cat]<3){
      S.levels[r.cat]++;S.catStreak[r.cat]=0;leveled=true;
    }
  }else{
    S.catStreak[r.cat]=0;
  }
  S.days[k]=r;save();
  var afterRank=rankOf(totalDone()).n;
  if(status==="done")showWin(beforeRank!==afterRank?afterRank:null,leveled?r.cat:null);
  else showFail();
  render();
}
function finishWeekly(status){
  var w=weekKey(new Date());
  var rec=S.weeks[w]||{};
  var beforeRank=rankOf(totalDone()).n;
  rec.status=status;S.weeks[w]=rec;save();
  var afterRank=rankOf(totalDone()).n;
  if(status==="done")showWin(beforeRank!==afterRank?afterRank:null,null,true);
  render();
}
function saveReflection(){
  var k=today(),r=S.days[k]||{};
  r.ref={
    q1:document.getElementById("r1").value.trim(),
    q2:document.getElementById("r2").value.trim(),
    q3:document.getElementById("r3").value.trim()
  };
  S.days[k]=r;save();render();
  toast("Zapísané do denníka.");
}

/* ---------- 12. VYKRESLENIE: DNES ---------- */
function placeLabel(p){
  if(p==="vsade")return"Všade";
  if(p==="ubytovna")return"Ubytovňa aj doma";
  return"Doma";
}
function remindCard(r){
  var mM=toMin(S.remind.morning),eM=toMin(S.remind.evening),n=nowMin();
  if(!r||!r.training){
    if(n>=mM)return '<div class="card order" style="padding:14px 16px;margin-bottom:14px"><div class="eyebrow">Pripomienka · '+esc(S.remind.morning)+'</div><div class="bark">Rozkaz dňa čaká. Potvrď tréning a vezmi si ho.</div></div>';
    return '<div class="card" style="padding:14px 16px;margin-bottom:14px"><div class="eyebrow">Ranný rozkaz o '+esc(S.remind.morning)+'</div><p class="hint" style="margin:0">Zostáva '+fmtLeft(mM-n)+'. Začať môžeš aj skôr.</p></div>';
  }
  if(!r.status){
    if(n>=eM)return '<div class="card warn" style="padding:14px 16px;margin-bottom:14px"><div class="eyebrow" style="color:var(--blood-bright)">Pripomienka · '+esc(S.remind.evening)+'</div><div class="bark">Deň sa končí a výzva nie je uzavretá. Ešte je čas.</div></div>';
    return '<div class="card" style="padding:14px 16px;margin-bottom:14px"><div class="eyebrow">Do večernej uzávierky</div><p class="hint" style="margin:0">Zostáva '+fmtLeft(eM-n)+' do '+esc(S.remind.evening)+'.</p></div>';
  }
  return "";
}
function renderDnes(){
  var k=today(),r=S.days[k],h=new Date().getHours();
  var out="";

  if(!S.setupDone){
    out+='<div class="card order"><div class="eyebrow">Prvé nastavenie</div>'+
    '<h2 style="font-size:22px">Vitaj v AGOGÉ.</h2>'+
    '<p style="margin-top:10px;color:#D8D4CC">Každý deň dostaneš jednu výzvu na 15–20 minút. Nie je to tréning – je to tréning hlavy. Všetky tri oblasti začínaš na úrovni 1 a appka ťa posúva sama.</p>'+
    '<p style="margin-top:10px;color:#D8D4CC">Najprv dve veci: kde teraz si a aký máš týždenný rozpis tréningu. Rozpis potrebujem preto, aby som ti nedal pôst v deň silového alebo dlhého tréningu.</p>'+
    '<button class="btn prim" type="button" data-act="setup">Nastaviť rozpis</button>'+
    '<button class="btn ghost" type="button" data-act="setupSkip">Preskočiť, nastavím neskôr</button></div>';
    return out;
  }

  out+=goalCard();
  out+='<div id="remindSlot">'+remindCard(r)+'</div>';

  /* pripomienka po vynechaní */
  if(yesterdayFailed()&&(!r||!r.status)){
    out+='<div class="card warn"><div class="eyebrow" style="color:var(--blood-bright)">Pozor</div>'+
    '<div class="bark">Včera si vynechal. Pravidlo je jasné: nikdy nie dvakrát po sebe.</div>'+
    '<p class="hint">Dnes to nemusí byť dokonalé. Musí to byť urobené.</p></div>';
  }

  /* 1. tréning dňa */
  if(!r||!r.training){
    var planned=S.schedule[String(new Date().getDay())]||"volno";
    out+='<div class="card order"><div class="eyebrow">Ráno · krok 1</div>'+
    '<div class="bark">Aký máš dnes tréning?</div>'+
    '<p class="hint">Podľa rozpisu: '+esc(DAYNAME[new Date().getDay()])+' – <b style="color:var(--bronze)">'+esc(TRAINING[planned])+'</b></p>'+
    '<button class="btn prim" type="button" data-act="train" data-t="'+planned+'">Potvrdiť: '+esc(TRAINING[planned])+'</button>'+
    '<div class="hint" style="margin-top:14px">Alebo zmeň:</div><div class="row2" style="margin-top:8px">';
    for(var t in TRAINING){
      if(t===planned)continue;
      out+='<button class="btn sm" type="button" data-act="train" data-t="'+t+'">'+esc(TRAINING[t])+'</button>';
    }
    out+='</div></div>';
    out+=quoteCard();
    return out;
  }

  /* 2. rozkaz dňa */
  var c=chById(r.id);
  if(!c){delete S.days[k];save();return renderDnes();}

  out+='<div class="card order">';
  out+='<div class="eyebrow">Rozkaz dňa · '+esc(CATNAME[c.cat||c.c])+' · úroveň '+c.l+'</div>';
  if(!r.status)out+='<div class="bark" style="margin-bottom:6px">'+esc(commanderLine())+'</div>';
  out+='<div class="ch-name">'+esc(c.t)+'</div>';
  out+='<div class="meta"><span class="tag b">'+esc(c.dur)+'</span><span class="tag">'+esc(placeLabel(c.p))+'</span><span class="tag">Dnes: '+esc(TRAINING[r.training])+'</span></div>';
  out+='<p class="ch-desc">'+esc(c.d)+'</p>';
  out+='<div class="why">'+esc(c.w)+'</div>';
  if(c.s)out+='<div class="safety"><b>Bezpečnosť:</b> '+esc(c.s)+'</div>';

  if(!r.status){
    out+='<button class="btn prim" type="button" data-act="done">Splnené</button>';
    out+='<button class="btn" type="button" data-act="nope">Nechce sa mi</button>';
    out+='<div class="row2" style="margin-top:10px">'+
      '<button class="btn sm" type="button" data-act="swap"'+(r.swaps>=1?" disabled":"")+'>'+(r.swaps>=1?"Výmena použitá":"Vymeniť")+'</button>'+
      '<button class="btn sm red" type="button" data-act="fail">Nesplnené</button></div>';
    if(r.swaps>=1)out+='<p class="hint">Vymeniť sa dá raz za deň. Dnes už bolo.</p>';
  }else{
    out+='<div style="margin-top:14px"><span class="badge '+(r.status==="done"?"d":"f")+'">'+(r.status==="done"?"Splnené":"Nesplnené")+'</span></div>';
  }
  out+='</div>';

  /* 3. týždenná AGOGÉ výzva */
  out+=weeklyCard();

  /* 3b. prísaha a nedeľné zúčtovanie */
  out+=oathCard();
  out+=reckoningCard();

  /* 4. myšlienka dňa */
  out+=quoteCard();

  /* 5. večerná reflexia */
  out+=reflectionCard(r,h);

  return out;
}

/* ---------- 14. ŠTATISTIKY ---------- */
function renderStat(){
  var tot=totalDone(),cur=currentStreak(),best=longestStreak(),by=doneByCat();
  var r=rankOf(tot),nx=nextRank(tot);
  var out='<div class="card"><div class="eyebrow">Hodnosť</div>'+
  '<div style="display:flex;align-items:center;gap:12px">'+insignia(tot,34)+
  '<div style="flex:1;min-width:0"><div class="disp" style="font-size:28px;color:var(--bronze)">'+esc(r.n)+'</div>'+
  '<p class="hint" style="margin-top:2px">'+tot+' splnených výziev spolu.</p></div></div>'+
  '<p style="color:#D8D4CC;margin-top:10px;font-style:italic">'+esc(r.w||"")+'</p>';
  if(nx){
    var need=nx.min-tot;
    var span=nx.min-r.min,prog=Math.max(0,Math.min(100,Math.round((tot-r.min)/span*100)));
    out+='<div class="bar" style="margin-top:12px"><i style="width:'+prog+'%"></i></div>'+
    '<p class="hint">Ešte '+need+' do hodnosti '+esc(nx.n)+'.</p>';
  }else{
    out+='<p class="hint">Najvyššia hodnosť. Teraz to už len drž.</p>';
  }
  out+='</div>';

  out+='<div class="card"><div class="eyebrow">Série</div>'+
  '<div style="display:flex;gap:10px">'+
  '<div style="flex:1"><div class="k" style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)">Teraz</div><div class="disp" style="font-size:30px;color:var(--bone);font-variant-numeric:tabular-nums">'+cur+'</div></div>'+
  '<div style="flex:1"><div class="k" style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)">Najdlhšia</div><div class="disp" style="font-size:30px;color:var(--bone);font-variant-numeric:tabular-nums">'+best+'</div></div>'+
  '</div><p class="hint">Séria je počet dní splnených za sebou.</p></div>';

  out+='<div class="card"><div class="eyebrow">Oblasti a úrovne</div>';
  var mx=Math.max(1,by.A,by.B,by.C);
  CATORDER.forEach(function(cc){
    out+='<div class="catrow"><div class="nmm">'+esc(CATNAME[cc])+'</div>'+
    '<div class="bar"><i style="width:'+Math.round(by[cc]/mx*100)+'%"></i></div>'+
    '<div class="nn">'+by[cc]+'</div></div>'+
    '<p class="hint" style="margin:4px 0 0 0">Úroveň '+S.levels[cc]+' · '+(S.catStreak[cc]||0)+'/5 do ďalšej úrovne</p>';
  });
  out+='<p class="hint" style="margin-top:14px">Úroveň sa zvýši, keď máš v oblasti päť splnených výziev za sebou. Jedna nesplnená počítadlo vynuluje.</p></div>';

  /* kalendár */
  var weeks=18,cells=[],t=new Date();
  var startDow=(t.getDay()+6)%7;
  var end=new Date(t.getFullYear(),t.getMonth(),t.getDate()+(6-startDow));
  var start=new Date(end.getFullYear(),end.getMonth(),end.getDate()-(weeks*7-1));
  var tk=today();
  for(var i=0;i<weeks*7;i++){
    var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    var kk=key(d),rec=S.days[kk];
    var cls=rec&&rec.status==="done"?"d":(rec&&rec.status==="fail"?"f":"");
    if(kk===tk)cls+=" t";
    cells.push('<i class="'+cls.trim()+'" title="'+kk+'"></i>');
  }
  out+='<div class="card"><div class="eyebrow">Posledných '+weeks+' týždňov</div>'+
  '<div class="gridwrap"><div class="cal">'+cells.join("")+'</div></div>'+
  '<div class="legend"><span><b style="background:var(--bronze)"></b>Splnené</span>'+
  '<span><b style="background:var(--blood)"></b>Nesplnené</span>'+
  '<span><b style="background:#1A1C21"></b>Nič</span>'+
  '<span><b style="background:transparent;box-shadow:0 0 0 2px var(--bone)"></b>Dnes</span></div></div>';

  /* dôkaz, že sa meníš */
  var pf=proofOfChange();
  if(pf.length){
    out+='<div class="card"><div class="eyebrow">Dôkaz, že sa meníš</div>'+
    '<p class="hint" style="margin:0 0 2px">Nie pocity. To, čo naozaj sedí v dátach.</p><div class="proof">';
    for(var i=0;i<pf.length;i++){
      out+='<div class="pr"><div class="lbl">'+esc(pf[i].l)+'</div><div class="tn">'+
      '<div class="th">'+esc(pf[i].th)+'</div><div class="ar">→</div><div class="nw">'+esc(pf[i].nw)+'</div></div></div>';
    }
    out+='</div></div>';
  }

  /* rebrík hodností */
  out+='<div class="card"><div class="eyebrow">Cesta</div><div class="ladder">';
  var ri=rankIdx(tot);
  for(var j=0;j<RANKS.length;j++){
    var cls=j<ri?"rk past":(j===ri?"rk on":"rk");
    out+='<div class="'+cls+'">'+(j<=ri?insignia(RANKS[j].min,20):'<span style="width:20px;display:inline-block"></span>')+
    '<div class="nm">'+esc(RANKS[j].n)+'</div>'+
    '<div class="dd">'+(j<=ri?"máš":(RANKS[j].min-tot)+" dní")+'</div></div>';
  }
  out+='</div></div>';
  return out;
}

/* ---------- 16. EXPORT / IMPORT ---------- */
function doExport(){
  var txt=JSON.stringify(S,null,2);
  ovl.innerHTML='<div class="ovl"><div class="ovl-in" style="text-align:left">'+
  '<div class="eyebrow">Export zálohy</div>'+
  '<p style="color:#D8D4CC;margin-bottom:10px">Skopíruj celý text a ulož si ho – do poznámok, do mailu sebe, kamkoľvek. Týmto textom sa dáta dajú obnoviť.</p>'+
  '<textarea id="expTxt" readonly style="min-height:200px;font-size:12px">'+esc(txt)+'</textarea>'+
  '<button class="btn prim" type="button" id="expCopy">Skopírovať</button>'+
  '<button class="btn ghost" type="button" id="ovlClose">Zatvoriť</button></div></div>';
  document.getElementById("ovlClose").onclick=closeOvl;
  var ta=document.getElementById("expTxt");
  document.getElementById("expCopy").onclick=function(){
    var ok=false;
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){toast("Záloha skopírovaná.");},function(){ta.select();toast("Text je označený – skopíruj ho ručne.");});
        ok=true;
      }
    }catch(e){}
    if(!ok){ta.select();toast("Text je označený – skopíruj ho ručne.");}
  };
}
function doImport(){
  ovl.innerHTML='<div class="ovl"><div class="ovl-in" style="text-align:left">'+
  '<div class="eyebrow">Import zálohy</div>'+
  '<p style="color:#D8D4CC;margin-bottom:10px">Vlož text zálohy. Prepíše to všetky súčasné dáta v tomto prehliadači.</p>'+
  '<textarea id="impTxt" style="min-height:200px;font-size:12px" placeholder="Sem vlož text zálohy"></textarea>'+
  '<button class="btn prim" type="button" id="impGo">Obnoviť dáta</button>'+
  '<button class="btn ghost" type="button" id="ovlClose">Zatvoriť</button></div></div>';
  document.getElementById("ovlClose").onclick=closeOvl;
  document.getElementById("impGo").onclick=function(){
    var v=document.getElementById("impTxt").value.trim();
    if(!v){toast("Prázdne pole.");return;}
    try{
      var o=JSON.parse(v);
      if(!o||typeof o!=="object"||!o.days)throw new Error("zly format");
      S=Object.assign(freshState(),o);
      S.levels=Object.assign({A:1,B:1,C:1},S.levels);
      S.catStreak=Object.assign({A:0,B:0,C:0},S.catStreak);
      S.days=S.days||{};S.weeks=S.weeks||{};
      save();closeOvl();render();toast("Dáta obnovené.");
    }catch(e){toast("Toto nie je platná záloha AGOGÉ.");}
  };
}

function doOath(){
  ovl.innerHTML='<div class="ovl"><div class="ovl-in" style="text-align:left">'+
  '<div class="eyebrow">Prísaha</div>'+
  '<h2 style="font-size:23px;color:var(--bone);margin-bottom:10px">Napíš si to raz. Vlastnými slovami.</h2>'+
  '<p class="hint" style="margin-bottom:4px">Krátko a konkrétne. Žiadne frázy – napíš to tak, ako by si to povedal nahlas. Toto ti hodím pred oči vtedy, keď stlačíš „Nechce sa mi“.</p>'+
  '<label for="oW">Prečo to robím?</label>'+
  '<textarea id="oW" placeholder="Napr. Lebo nechcem byť chlap, ktorý sa vyhovára na únavu.">'+esc(S.oath.why)+'</textarea>'+
  '<label for="oK">Kým chcem byť o rok?</label>'+
  '<textarea id="oK" placeholder="Napr. Chlap, ktorý dokončí Spartan Super a doma je pri deťoch, nie pri mobile.">'+esc(S.oath.who)+'</textarea>'+
  '<button class="btn prim" type="button" id="oGo">Toto je moja prísaha</button>'+
  '<button class="btn ghost" type="button" id="ovlClose">Teraz nie</button></div></div>';
  document.getElementById("ovlClose").onclick=closeOvl;
  document.getElementById("oGo").onclick=function(){
    S.oath.why=document.getElementById("oW").value.trim().slice(0,300);
    S.oath.who=document.getElementById("oK").value.trim().slice(0,300);
    save();closeOvl();render();
    if(S.oath.why)toast("Zapísané. Teraz to plať.");
  };
}
function doSetup(){
  ovl.innerHTML='<div class="ovl"><div class="ovl-in" style="text-align:left">'+
  '<div class="eyebrow">Krok 1 z 2 · Kde teraz si</div>'+
  '<div class="row2" style="margin-bottom:6px">'+
  '<button class="btn sm '+(S.mode==="nemecko"?"prim":"")+'" type="button" id="sM1">Nemecko</button>'+
  '<button class="btn sm '+(S.mode==="doma"?"prim":"")+'" type="button" id="sM2">Doma</button></div>'+
  '<p class="hint">Prepnúť sa to dá kedykoľvek hore vpravo.</p>'+
  '<div class="eyebrow" style="margin-top:20px">Krok 2 z 2 · Týždenný rozpis</div>'+
  '<p class="hint" style="margin:0 0 10px">Aby som ti nedal pôst v deň silového alebo dlhého tréningu.</p>'+
  '<div id="sSch"></div>'+
  '<button class="btn prim" type="button" id="sGo">Hotovo, daj mi prvý rozkaz</button></div></div>';
  function paint(){
    var h="";
    for(var i=1;i<=7;i++){
      var dw=i%7;
      h+='<div class="sch"><span>'+esc(DAYNAME[dw].slice(0,3))+'</span><select data-day="'+dw+'" aria-label="'+esc(DAYNAME[dw])+'">';
      for(var t in TRAINING)h+='<option value="'+t+'"'+(S.schedule[String(dw)]===t?" selected":"")+'>'+esc(TRAINING[t])+'</option>';
      h+='</select></div>';
    }
    document.getElementById("sSch").innerHTML=h;
  }
  paint();
  document.getElementById("sM1").onclick=function(){S.mode="nemecko";save();doSetup();};
  document.getElementById("sM2").onclick=function(){S.mode="doma";save();doSetup();};
  document.getElementById("sGo").onclick=function(){
    var sels=ovl.querySelectorAll("select[data-day]");
    for(var i=0;i<sels.length;i++)S.schedule[sels[i].getAttribute("data-day")]=sels[i].value;
    S.setupDone=true;save();render();doOath();
  };
}

/* ---------- 17. ROUTER + UDALOSTI ---------- */
var VIEWS=["Dnes","Dennik","Stat","Info"];
var view="Dnes";
function go(v){
  if(VIEWS.indexOf(v)<0)v="Dnes";
  view=v;
  try{if(location.hash.slice(1)!==v.toLowerCase())location.hash=v.toLowerCase();}catch(e){}
  render();
  window.scrollTo(0,0);
}
function render(){
  var tot=totalDone();
  document.getElementById("hRank").textContent=rankOf(tot).n;
  document.getElementById("hStreak").textContent=currentStreak()+" dní";
  document.getElementById("hTotal").textContent=String(tot);
  var rp=document.getElementById("rankProg");
  if(rp){
    var rr=rankOf(tot),nn=nextRank(tot);
    var bar="",lbl;
    if(nn){
      var span=nn.min-rr.min;
      bar='<div class="bar"><i style="width:'+Math.max(0,Math.min(100,Math.round((tot-rr.min)/span*100)))+'%"></i></div>';
      lbl="Ešte "+(nn.min-tot)+" do hodnosti "+nn.n;
    }else{
      bar='<div class="bar"><i style="width:100%"></i></div>';
      lbl="Najvyššia hodnosť. Drž ju.";
    }
    rp.innerHTML=insignia(tot,26)+'<div class="txt"><div class="lbl">'+esc(lbl)+'</div>'+bar+'</div>';
  }
  var mb=document.getElementById("modeBtn");
  mb.textContent=S.mode==="nemecko"?"Nemecko":"Doma";
  mb.setAttribute("aria-label","Režim: "+mb.textContent+". Prepnúť.");

  document.getElementById("vDnes").hidden=view!=="Dnes";
  document.getElementById("vDennik").hidden=view!=="Dennik";
  document.getElementById("vStat").hidden=view!=="Stat";
  document.getElementById("vInfo").hidden=view!=="Info";

  if(view==="Dnes")document.getElementById("vDnes").innerHTML=renderDnes();
  if(view==="Dennik")document.getElementById("vDennik").innerHTML=renderDennik();
  if(view==="Stat")document.getElementById("vStat").innerHTML=renderStat();
  if(view==="Info")document.getElementById("vInfo").innerHTML=renderInfo();

  var navs=document.querySelectorAll(".nav button");
  for(var i=0;i<navs.length;i++){
    if(navs[i].getAttribute("data-v")===view)navs[i].setAttribute("aria-current","page");
    else navs[i].removeAttribute("aria-current");
  }
}

document.querySelector(".nav").addEventListener("click",function(e){
  var b=e.target.closest("button[data-v]");
  if(b)go(b.getAttribute("data-v"));
});
document.getElementById("modeBtn").addEventListener("click",function(){
  S.mode=S.mode==="nemecko"?"doma":"nemecko";
  var k=today(),r=S.days[k];
  if(r&&!r.status&&r.id){
    var c=chById(r.id);
    if(c&&!placeOk(c)){
      var c2=pick(r.cat,r.training,[c.id]);
      r.id=c2.id;S.days[k]=r;
      toast("Režim prepnutý. Dostal si novú výzvu.");
    }else toast("Režim: "+(S.mode==="nemecko"?"Nemecko":"Doma"));
  }else toast("Režim: "+(S.mode==="nemecko"?"Nemecko":"Doma"));
  save();render();
});
document.getElementById("app").addEventListener("click",function(e){
  var b=e.target.closest("button[data-act]");
  if(!b)return;
  var a=b.getAttribute("data-act");
  if(a==="train")setTraining(b.getAttribute("data-t"));
  else if(a==="done")finish("done");
  else if(a==="fail")finish("fail");
  else if(a==="swap")swap();
  else if(a==="nope")showNope();
  else if(a==="saveref")saveReflection();
  else if(a==="editref"){var k=today();if(S.days[k]){S.days[k].ref=null;save();render();}}
  else if(a==="wdone")finishWeekly("done");
  else if(a==="wskip")finishWeekly("skip");
  else if(a==="mode"){S.mode=b.getAttribute("data-m");save();render();}
  else if(a==="export")doExport();
  else if(a==="import")doImport();
  else if(a==="reset")doReset();
  else if(a==="setup")doSetup();
  else if(a==="notif"){if(S.remind.notif){S.remind.notif=false;save();render();toast("Pripomienky v prehliadači vypnuté.");}else askNotif();}
  else if(a==="oath")doOath();
  else if(a==="setupSkip"){S.setupDone=true;save();render();}
});
document.getElementById("app").addEventListener("change",function(e){
  var s=e.target.closest("select[data-day]");
  if(s){S.schedule[s.getAttribute("data-day")]=s.value;save();toast("Rozpis uložený.");return;}
  var g=e.target.closest("input[data-goal]");
  if(g){
    S.goal[g.getAttribute("data-goal")]=g.value.trim().slice(0,80);
    save();render();toast("Cieľ uložený.");return;
  }
  var t=e.target.closest("input[data-rem]");
  if(t){
    var v=t.value;
    if(!/^\d{1,2}:\d{2}$/.test(v)){toast("Neplatný čas.");return;}
    S.remind[t.getAttribute("data-rem")]=v;save();render();
    toast("Čas uložený.");
  }
});
window.addEventListener("hashchange",function(){
  var h=(location.hash||"").slice(1);
  var m={dnes:"Dnes",dennik:"Dennik",stat:"Stat",info:"Info"};
  if(m[h]&&m[h]!==view){view=m[h];render();}
});

/* ---------- 18. MINÚTOVÝ TIK (lišta + pripomienky) ---------- */
var curDay=null;
function tick(){
  var k=today();
  if(curDay&&curDay!==k){curDay=k;render();return;}
  curDay=k;

  var r=S.days[k],n=nowMin();
  var mM=toMin(S.remind.morning),eM=toMin(S.remind.evening);
  var flags=S.notified[k]||{};
  if(n>=mM&&!flags.m&&(!r||!r.training)){
    flags.m=1;S.notified[k]=flags;save();
    fireNotif("AGOGÉ – rozkaz dňa","Potvrď tréning a vezmi si dnešnú výzvu.");
  }
  if(n>=eM&&!flags.e&&(!r||!r.status)){
    flags.e=1;S.notified[k]=flags;save();
    fireNotif("AGOGÉ – uzavri deň","Výzva ešte nie je uzavretá. Ešte je čas.");
  }
  /* staré značky preč, nech dáta nerastú */
  var keys=Object.keys(S.notified);
  if(keys.length>40){keys.sort();for(var i=0;i<keys.length-30;i++)delete S.notified[keys[i]];save();}

  if(view!=="Dnes")return;
  if(document.getElementById("ovl").innerHTML)return;
  var ae=document.activeElement;
  if(ae&&(ae.tagName==="TEXTAREA"||ae.tagName==="INPUT"||ae.tagName==="SELECT"))return;
  var slot=document.getElementById("remindSlot");
  if(slot)slot.innerHTML=remindCard(r);
}

/* ---------- 19. ŠTART ---------- */
load();
(function(){
  var h=(location.hash||"").slice(1);
  var m={dnes:"Dnes",dennik:"Dennik",stat:"Stat",info:"Info"};
  if(m[h])view=m[h];
})();
render();
curDay=today();
setInterval(tick,30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)tick();});
</script>
